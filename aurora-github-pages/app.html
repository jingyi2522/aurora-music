nal{font-style:normal;color:#aaa8b3;font-size:18px;padding:9px}.empty{color:#9d9ba5;padding:24px 4px;font-size:14px}.dock{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:430px;width:100%;background:#1b1b23f2;border-top:1px solid #34333d;backdrop-filter:blur(22px);padding-bottom:env(safe-area-inset-bottom)}.mini{height:61px;margin:0 13px;display:flex;gap:10px;align-items:center;border-bottom:1px solid #34333d}.mini .art{width:42px;height:42px}.mini .info{flex:1}.mini b{font-size:13px}.mini span{display:block;color:#a6a4af;font-size:11px;margin-top:3px}.mini button{border:0;background:transparent;color:#fff;font-size:19px;padding:8px}.tabs{height:60px;display:flex;justify-content:space-around;align-items:center;color:#92909d;font-size:10px}.tabs div{text-align:center}.tabs strong{display:block;font-size:20px;font-weight:400;margin-bottom:3px}.tabs .active{color:#fff}.sheet{display:none;position:absolute;z-index:4;inset:0;background:linear-gradient(155deg,#272137,#0d0d12 68%);padding:env(safe-area-inset-top) 25px calc(28px + env(safe-area-inset-bottom));flex-direction:column}.sheet.open{display:flex}.sheetheader{display:flex;justify-content:space-between;align-items:center;height:50px}.sheetheader button{border:0;background:transparent;color:white;font-size:24px}.sheetheader span{text-align:center;font-size:11px;letter-spacing:.7px}.sheetheader b{display:block;margin-top:3px;font-size:13px;letter-spacing:0}.bigart{width:100%;aspect-ratio:1;border-radius:19px;background-size:cover;background-position:center;margin:28px 0 23px;box-shadow:0 28px 60px #0008}.meta{display:flex;justify-content:space-between;align-items:center}.meta h2{font-size:24px;letter-spacing:-.7px;margin:0}.meta p{margin:4px 0;color:#aaa8b4}.meta button{border:0;background:transparent;color:#c9ff57;font-size:21px}.bar{height:4px;border-radius:5px;background:#4a4854;margin-top:30px}.bar i{display:block;width:30%;height:100%;border-radius:5px;background:#fff}.time{font-size:11px;col <div class="app"><div class="status"><span>9:41</span><span>▮▮▮ ᯤ ▰</span></div><div class="top"><div><small>你的双曲库</small><h1>为你而听</h1></div><div class="avatar">J</div></div><input id="search" class="search" placeholder="⌕  搜索歌名或艺人"><div id="chips" class="chips"><button class="on" data-filter="全部">全部</button><button data-filter="华语">华语</button><button data-filter="English">English</button><button data-filter="粤语">粤语</button><button data-filter="Apple Music">Apple Music</button></div><div id="notice" class="notice"><b>免费独立音乐</b>可在 Aurora 内播放；带 Apple Music 标记的歌曲会跳转至正版服务。</div><div class="heading"><h2>音乐库</h2><span id="count"></span></div><div id="tracks" class="tracks"></div><div class="dock"><div class="mini" id="mini"><div class="art" id="miniArt"></div><div class="info"><b id="miniTitle">晨光未醒</b><span id="miniArtist">林初 · 免费独立音乐</span></div><button id="miniPlay">▶</button></div><div class="tabs"><div class="active"><strong>⌂</strong>首页</div><div><strong>◈</strong>浏览</div><div><strong>♬</strong>资料库</div></div></div><section id="sheet" class="sheet"><div class="sheetheader"><button id="close">⌄</button><span>正在播放<b>免费独立音乐</b></span><button>···</button></div><div class="bigart" id="bigArt"></div><div class="meta"><div><h2 id="bigTitle">晨光未醒</h2><p id="bigArtist">林初</p></div><button id="heart">♥</button></div><div class="bar"><i></i></div><div class="time"><span>1:08</span><span>3:42</span></div><div class="controls"><button>↶</button><button class="pause" id="play">▶</button><button>↷</button></div></section></div>
<script>
const music=[
 {title:'晨光未醒',artist:'林初',lang:'华语',source:'免费独立音乐',art:'https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?auto=format&fit=crop&w=500&q=80'},
 {title:'慢慢靠近',artist:'陈婉晴',lang:'华语',source:'免费独立音乐',art:'https://images.unsplash.com/photo-1470229722913-7c0e2dbbafd3?auto=format&fit=crop&w=500&q=80'},
 {title:'Blue Hour',artist:'Cigarettes After',lang:'English',source:'Apple Music',art:'https://images.unsplash.com/photo-1524368535928-5b5e00ddc76b?auto=format&fit=crop&w=500&q=80'},
 {title:'海岸线',artist:'落日飞车',lang:'粤语',source:'Apple Music',art:'https://images.unsplash.com/photo-1516575150278-77136aed6920?auto=format&fit=crop&w=500&q=80'},
 {title:'Paper Planes',artist:'Sora Field',lang:'English',source:'免费独立音乐',art:'https://images.unsplash.com/photo-1501386761578-eac5c94b800a?auto=format&fit=crop&w=500&q=80'}];
let active=0,filter='全部',isPlaying=false;const $=x=>document.querySelector(x);function filtered(){let q=$('#search').value.toLowerCase();return music.filter(x=>(filter==='全部'||x.lang===filter||x.source===filter)&&(x.title+x.artist).toLowerCase().includes(q))}function render(){let v=filtered();$('#count').textContent=v.length+' 首';$('#tracks').innerHTML=v.length?v.map(x=>{let i=music.indexOf(x);return `<button class="track" data-i="${i}"><span class="art" style="background-image:url('${x.art}')"></span><span><b>${x.title}</b><small>${x.artist}</small><small class="badge">${x.source} · ${x.lang}</small></span><i class="external">${x.source==='Apple Music'?'↗':'▶'}</i></button>`}).join(''):'<p class="empty">没有找到匹配的音乐</p>'}function set(i){active=i;let x=music[i];['miniArt','bigArt'].forEach(id=>$('#'+id).style.backgroundImage=`url('${x.art}')`);$('#miniTitle').textContent=$('#bigTitle').textContent=x.title;$('#bigArtist').textContent=x.artist;$('#miniArtist').textContent=x.artist+' · '+x.source;$('.sheetheader b').textContent=x.source}function playing(v=!isPlaying){isPlaying=v;$('#miniPlay').textContent=$('#play').textContent=v?'❚❚':'▶'}$('#chips').onclick=e=>{let b=e.target.closest('button');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('#chips button').forEach(x=>x.classList.toggle('on',x===b));$('#notice').innerHTML=filter==='Apple Music'?'<b>Apple Music</b> 内容将在用户设备中打开正版服务，需要用户自己的订阅。':'<b>免费独立音乐</b>可在 Aurora 内播放；带 Apple Music 标记的歌曲会跳转至正版服务。';render()};$('#search').oninput=render;$('#tracks').onclick=e=>{let row=e.target.closest('[data-i]');if(!row)return;let i=+row.dataset.i;set(i);if(music[i].source==='Apple Music')window.open('https://music.apple.com','_blank');else{playing(true);$('#sheet').classList.add('open')}};$('#mini').onclick=e=>{if(e.target!==$('#miniPlay'))$('#sheet').classList.add('open')};$('#miniPlay').onclick=e=>{e.stopPropagation();playing()};$('#play').onclick=()=>playing();$('#close').onclick=()=>$('#sheet').classList.remove('open');$('#heart').onclick=e=>e.target.style.color=e.target.style.color?'':'#ff658f';set(0);render();
</script></html>
