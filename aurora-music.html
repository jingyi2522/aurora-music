<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Aurora Music</title>
  <style>
    :root{--bg:#08080c;--panel:#12121a;--panel2:#191922;--line:#292936;--text:#f7f5fa;--muted:#a4a2ad;--pink:#f35c9e;--violet:#8a6dff;--lime:#c4fa54}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 78% -4%,#423069 0,transparent 28rem),radial-gradient(circle at 12% 55%,#263b55 0,transparent 28rem),var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-.01em}button,input{font:inherit}button{color:inherit;cursor:pointer}.app{display:grid;grid-template-columns:235px 1fr;min-height:100vh;padding-bottom:106px}.side{position:fixed;inset:0 auto 0 0;width:235px;padding:30px 20px;border-right:1px solid var(--line);background:#0b0b10cc;backdrop-filter:blur(18px);z-index:5}.brand{font-family:Georgia,serif;font-size:27px;letter-spacing:-1.5px}.brand i{color:var(--pink);font-style:normal}.nav{margin:42px 0 34px;display:grid;gap:5px}.nav button,.library button{display:flex;align-items:center;gap:13px;width:100%;border:0;background:transparent;padding:12px;border-radius:10px;text-align:left;color:var(--muted)}.nav button.active,.nav button:hover,.library button:hover{background:#242331;color:#fff}.ico{width:19px;text-align:center;font-size:17px}.side h4{font-size:11px;color:#777482;text-transform:uppercase;letter-spacing:.13em;margin:26px 12px 9px}.library button{font-size:14px}.side-footer{position:absolute;bottom:27px;left:20px;right:20px;background:linear-gradient(135deg,#312260,#942d72);padding:16px;border-radius:15px;font-size:13px;line-height:1.4}.side-footer b{display:block;margin-bottom:5px}.main{grid-column:2;padding:27px clamp(24px,4vw,68px) 30px;max-width:1500px;width:100%}.top{display:flex;align-items:center;justify-content:space-between;gap:18px}.search{width:min(430px,48%);position:relative}.search input{width:100%;border:1px solid #32313e;background:#15151d;color:#fff;border-radius:22px;padding:12px 16px 12px 40px;outline:none}.search:before{content:'⌕';position:absolute;left:16px;top:8px;color:var(--muted);font-size:23px}.profile{display:flex;align-items:center;gap:11px;font-size:14px}.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#ffbd9e,#8152e9);display:grid;place-items:center;font-weight:800}.hero{margin-top:38px;min-height:274px;border-radius:22px;overflow:hidden;position:relative;padding:38px 42px;display:flex;align-items:flex-end;background:linear-gradient(105deg,#120e19 22%,transparent 66%),url('https://images.unsplash.com/photo-1516280440614-37939bbacd81?auto=format&fit=crop&w=1600&q=80') center/cover}.hero:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#0d0c13d9,transparent 72%)}.hero-copy{position:relative;z-index:1;max-width:450px}.eyebrow{color:var(--lime);font-size:11px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}.hero h1{font-family:Georgia,serif;font-size:clamp(35px,4vw,60px);line-height:.95;letter-spacing:-.06em;margin:11px 0}.hero p{margin:0 0 20px;color:#d3d0d9;font-size:14px}.play{border:0;border-radius:999px;background:var(--lime);color:#151515;font-weight:800;padding:12px 20px}.play:hover{transform:translateY(-1px);filter:brightness(1.08)}.section{margin-top:37px}.heading{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px}.heading h2{font-size:20px;margin:0}.heading button{background:0;border:0;color:var(--muted);font-size:13px}.albums{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:18px}.album{background:transparent;border:0;padding:0;text-align:left;min-width:0}.cover{aspect-ratio:1;border-radius:13px;background-size:cover;background-position:center;position:relative;overflow:hidden;box-shadow:0 10px 22px #0003}.album:hover .cover:after{content:'▶';position:absolute;inset:auto 10px 10px auto;width:37px;height:37px;display:grid;place-items:center;border-radius:50%;background:var(--lime);color:#101012;font-size:13px}.album b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:10px 0 4px;font-size:14px}.album span{color:var(--muted);font-size:13px}.mix{display:grid;grid-template-columns:1.2fr .8fr;gap:38px}.track-list{border-top:1px solid var(--line)}.track{display:grid;grid-template-columns:30px 45px 1fr 90px 25px;gap:13px;align-items:center;padding:10px 4px;border-bottom:1px solid #24242d}.track:hover{background:#1a1a23}.track.playing{color:var(--lime)}.smallcover{width:42px;height:42px;border-radius:7px;background-size:cover;background-position:center}.track b{font-size:14px}.track em{display:block;font-size:12px;color:var(--muted);font-style:normal;margin-top:3px}.track time{font-size:13px;color:var(--muted)}.heart{background:transparent;border:0;color:var(--muted);font-size:18px}.heart.saved{color:var(--pink)}.card{background:linear-gradient(150deg,#212033,#15151f);border:1px solid #343244;border-radius:18px;padding:22px}.card h3{margin:0 0 5px;font-size:17px}.card p{margin:0 0 20px;color:var(--muted);font-size:13px}.genre{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid #353442;font-size:14px}.genre span{color:var(--muted);font-size:13px}.player{position:fixed;z-index:10;bottom:0;left:235px;right:0;height:106px;border-top:1px solid #302f39;background:#111116ee;backdrop-filter:blur(18px);display:grid;grid-template-columns:1fr minmax(270px,1.5fr) 1fr;align-items:center;padding:0 34px;gap:28px}.now{display:flex;align-items:center;gap:12px;min-width:0}.now .smallcover{width:53px;height:53px}.now b{font-size:14px}.now span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.controls{text-align:center}.controls button{background:0;border:0;font-size:18px;margin:0 7px}.controls .big{width:38px;height:38px;border-radius:50%;background:#f3f1f7;color:#111;font-size:14px}.progress{display:flex;align-items:center;gap:9px;color:#999;font-size:11px;margin-top:7px}.bar{height:4px;background:#3a3943;border-radius:10px;flex:1;cursor:pointer}.fill{height:100%;width:32%;border-radius:10px;background:var(--lime)}.volume{text-align:right;color:#b7b5c0;font-size:19px}.volume input{accent-color:var(--lime);width:100px;vertical-align:middle}@media(max-width:850px){.app{display:block}.side{position:static;width:auto;height:auto;border-right:0;padding:19px 20px;display:flex;align-items:center;gap:20px}.brand{font-size:24px}.nav{margin:0;display:flex;overflow:auto}.nav button{width:auto;padding:9px}.nav .ico{display:none}.library,.side-footer{display:none}.main{padding:24px 22px 130px}.player{left:0;padding:0 18px;grid-template-columns:1fr 1fr}.volume{display:none}.albums{grid-template-columns:repeat(4,minmax(115px,1fr));overflow:auto}.mix{grid-template-columns:1fr}.hero{padding:29px;min-height:250px}}@media(max-width:520px){.profile span{display:none}.search{width:65%}.hero{margin-top:24px}.hero h1{font-size:39px}.albums{grid-template-columns:repeat(2,1fr)}.player{height:116px;grid-template-columns:1fr}.now{display:none}.controls{width:100%}.track{grid-template-columns:22px 42px 1fr 23px}.track time{display:none}.main{padding-bottom:137px}}
  </style>
</head>
<body>
<div class="app">
  <aside class="side"><div class="brand">aur<i>o</i>ra</div><nav><button class="active"><span class="ico">⌂</span>发现</button><button><span class="ico">◈</span>浏览</button><button><span class="ico">⌕</span>搜索</button></nav><div class="library"><h4>你的音乐库</h4><button>最近播放</button><button>我的收藏</button><button>下载的音乐</button><h4>歌单</h4><button>+ 新建歌单</button><button>夜行电台</button><button>灵感采样</button></div><div class="side-footer"><b>升级至 Aurora+</b>无广告、无损音质与离线播放</div></aside>
  <main class="main"><div class="top"><div class="search"><input id="search" placeholder="搜索歌曲、专辑或艺人" /></div><div class="profile"><span>下午好，Jingyi</span><div class="avatar">J</div></div></div>
    <section class="hero"><div class="hero-copy"><div class="eyebrow">为你精选 · 周二</div><h1>让声音<br>带你远行</h1><p>从此刻的心情出发，聆听一组为你准备的温柔旋律。</p><button class="play" id="heroPlay">▶ 播放此歌单</button></div></section>
    <section class="section"><div class="heading"><h2>今日推荐</h2><button>查看全部 →</button></div><div class="albums" id="albums"></div></section>
    <section class="section mix"><div><div class="heading"><h2>你的常听</h2><button>查看全部 →</button></div><div class="track-list" id="tracks"></div></div><div class="card"><h3>探索新的声音</h3><p>根据你的聆听习惯，挑选一些可能会喜欢的风格。</p><div class="genre"><b>梦幻流行</b><span>94% 匹配</span></div><div class="genre"><b>独立民谣</b><span>89% 匹配</span></div><div class="genre"><b>氛围电子</b><span>82% 匹配</span></div><button class="play" style="margin-top:20px">开始探索</button></div></section>
  </main>
</div>
<footer class="player"><div class="now"><div class="smallcover" id="nowCover"></div><div><b id="nowTitle">Afterglow</b><span id="nowArtist">Luna Vale</span></div><button class="heart saved" id="likeNow">♥</button></div><div class="controls"><div><button title="上一首">↶</button><button class="big" id="toggle" title="播放">▶</button><button title="下一首">↷</button></div><div class="progress"><span id="elapsed">1:12</span><div class="bar" id="bar"><div class="fill" id="fill"></div></div><span>3:45</span></div></div><div class="volume">♬ <input aria-label="音量" type="range" min="0" max="100" value="72"></div></footer>
<script>
const songs=[
 {title:'Afterglow',artist:'Luna Vale',time:'3:45',c:'https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?auto=format&fit=crop&w=500&q=80'},
 {title:'慢慢靠近',artist:'陈婉晴',time:'4:08',c:'https://images.unsplash.com/photo-1470229722913-7c0e2dbbafd3?auto=format&fit=crop&w=500&q=80'},
 {title:'Blue Hour',artist:'Cigarettes After',time:'3:26',c:'https://images.unsplash.com/photo-1524368535928-5b5e00ddc76b?auto=format&fit=crop&w=500&q=80'},
 {title:'海岸线',artist:'落日飞车',time:'4:01',c:'https://images.unsplash.com/photo-1516575150278-77136aed6920?auto=format&fit=crop&w=500&q=80'},
 {title:'First Light',artist:'Mira Coast',time:'3:54',c:'https://images.unsplash.com/photo-1501386761578-eac5c94b800a?auto=format&fit=crop&w=500&q=80'},
];
const albums=[['午夜蓝调','Aurora 编选',songs[0].c],['沿海公路','落日飞车',songs[3].c],['Soft Focus','Luna Vale',songs[2].c],['城市的夜','林北',songs[4].c]];
let current=0,playing=false,progress=32,timer;const $=s=>document.querySelector(s);
$('#albums').innerHTML=albums.map((a,i)=>`<button class="album" data-song="${i}"><div class="cover" style="background-image:url('${a[2]}')"></div><b>${a[0]}</b><span>${a[1]}</span></button>`).join('');
function renderTracks(filter=''){const list=songs.filter(s=>(s.title+s.artist).toLowerCase().includes(filter.toLowerCase()));$('#tracks').innerHTML=list.map((s,i)=>`<div class="track ${songs.indexOf(s)===current?'playing':''}" data-index="${songs.indexOf(s)}"><span>${String(songs.indexOf(s)+1).padStart(2,'0')}</span><div class="smallcover" style="background-image:url('${s.c}')"></div><div><b>${s.title}</b><em>${s.artist}</em></div><time>${s.time}</time><button class="heart ${songs.indexOf(s)===0?'saved':''}" aria-label="收藏">♥</button></div>`).join('')||'<p style="color:#aaa;padding:20px 0">没有找到相关音乐</p>'}renderTracks();
function setSong(i){current=i;const s=songs[i];$('#nowTitle').textContent=s.title;$('#nowArtist').textContent=s.artist;$('#nowCover').style.backgroundImage=`url('${s.c}')`;renderTracks($('#search').value);}
function setPlaying(state){playing=state;$('#toggle').textContent=state?'❚❚':'▶';$('#toggle').title=state?'暂停':'播放';clearInterval(timer);if(state)timer=setInterval(()=>{progress=progress>=100?0:progress+.35;$('#fill').style.width=progress+'%';let total=225,sec=Math.round(total*progress/100);$('#elapsed').textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')},700)}
document.addEventListener('click',e=>{const t=e.target.closest('.track');if(t&&!e.target.closest('.heart')){setSong(+t.dataset.index);setPlaying(true)}const a=e.target.closest('.album');if(a){setSong(+a.dataset.song);setPlaying(true)}if(e.target.closest('.heart'))e.target.closest('.heart').classList.toggle('saved')});
$('#toggle').onclick=()=>setPlaying(!playing);$('#heroPlay').onclick=()=>{setSong(0);setPlaying(true)};$('#search').oninput=e=>renderTracks(e.target.value);$('#bar').onclick=e=>{progress=(e.offsetX/e.currentTarget.offsetWidth)*100;$('#fill').style.width=progress+'%'};setSong(0);
</script>
</body></html>
